<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>开席倒计时</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"PingFang SC","Microsoft YaHei","SimSun",serif;
}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 30% 20%, rgba(255, 180, 90, 0.45), transparent 26%),
    radial-gradient(circle at 70% 90%, rgba(255, 110, 40, 0.35), transparent 28%),
    linear-gradient(135deg,#e56a1e 0%,#d84b18 45%,#b53512 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  padding:30px;
  position:relative;
  overflow:hidden;
}
body::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,0.04) 1px, transparent 1.2px),
    radial-gradient(circle at 80% 70%, rgba(255,255,255,0.035) 1px, transparent 1.4px);
  background-size:220px 220px, 180px 180px;
  pointer-events:none;
  opacity:.55;
}
.frame{
  position:relative;
  width:100%;
  max-width:1180px;
  min-height:80vh;
  padding:50px 40px;
  border:2px solid rgba(243,243,239,0.75);
  border-radius:20px;
  box-shadow:0 0 40px rgba(0,0,0,0.25);
  background:linear-gradient(145deg, rgba(255,150,70,0.12), rgba(200,70,20,0.12));
}
/* 四角金边飘带 */
.corner{
  position:absolute;
  width:160px;
  height:160px;
  filter:grayscale(1) brightness(1.6);
  background:url("https://p3-flow-image-sign.byteimg.com/tos-cn-i-a9rns2rl98/42121100839e44389201003414021110~tplv-a9rns2rl98-image.image") no-repeat center/contain;
  opacity:0.85;
  pointer-events:none;
}
.corner-tl{top:-10px;left:-10px;transform:rotate(0deg);}
.corner-tr{top:-10px;right:-10px;transform:scaleX(-1);}
.corner-bl{bottom:-10px;left:-10px;transform:scaleY(-1);}
.corner-br{bottom:-10px;right:-10px;transform:scale(-1,-1);}
/* 顶部囍 + 良辰将至 */
.top-double-happiness{
  text-align:center;
  font-size:32px;
  color:#F3F3EF;
  letter-spacing:10px;
  margin-bottom:10px;
  text-shadow:0 2px 12px rgba(0,0,0,0.25);
}
.top-sub{
  text-align:center;
  font-size:18px;
  letter-spacing:6px;
  color:#F3F3EF;
  opacity:.9;
  margin-bottom:16px;
}
.main-title{
  text-align:center;
  font-size:56px;
  font-weight:bold;
  letter-spacing:12px;
  color:#fff;
  text-shadow:0 4px 20px rgba(0,0,0,0.35);
  margin-bottom:12px;
}
.sub-title{
  text-align:center;
  font-size:18px;
  letter-spacing:6px;
  color:#F3F3EF;
  margin-bottom:40px;
  opacity:.9;
}
.count-wrap{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-bottom:36px;
}
.count-item{
  width:120px;
  height:140px;
  background:linear-gradient(180deg,#ffffff 0%,#F3F3EF 100%);
  border-radius:16px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 10px 26px rgba(0,0,0,0.2);
  position:relative;
}
.count-item::before{
  content:"";
  position:absolute;
  inset:8px;
  border:1px solid rgba(243,243,239,0.75);
  border-radius:12px;
}
.count-num{
  font-size:48px;
  font-weight:800;
  color:#b83412;
  line-height:1;
  font-family:"DIN","Arial",sans-serif;
  letter-spacing:2px;
}
.count-unit{
  margin-top:10px;
  font-size:16px;
  color:#8a2b10;
  letter-spacing:4px;
}
.mid-text{
  text-align:center;
  font-size:20px;
  color:#fff;
  letter-spacing:4px;
  margin-bottom:10px;
  opacity:.95;
}
.mid-date{
  text-align:center;
  font-size:18px;
  color:#F3F3EF;
  letter-spacing:2px;
  margin-bottom:40px;
  opacity:.85;
}
.footer-text{
  text-align:center;
  font-size:18px;
  letter-spacing:4px;
  color:#F3F3EF;
  opacity:.85;
}
.footer-xi{
  text-align:center;
  font-size:34px;
  color:#F3F3EF;
  margin-top:8px;
  letter-spacing:16px;
}
/* 左下角：柯基 + 牡丹花 */
.deco-left{
  position:absolute;
  bottom:0px;
  left:0px;
  width:320px;
  height:320px;
  background:url("https://p3-flow-image-sign.byteimg.com/tos-cn-i-a9rns2rl98/22414301483c44388212201200844773~tplv-a9rns2rl98-image.image") no-repeat bottom left/contain;
  pointer-events:none;
}
/* 右下角：三只猫猫狗狗 */
.deco-right{
  position:absolute;
  bottom:0px;
  right:0px;
  width:360px;
  height:320px;
  background:url("https://p3-flow-image-sign.byteimg.com/tos-cn-i-a9rns2rl98/14204040844a44089130020044041761~tplv-a9rns2rl98-image.image") no-repeat bottom right/contain;
  pointer-events:none;
}
/* 星星点缀 */
.star{
  position:absolute;
  width:12px;
  height:12px;
  background:#F3F3EF;
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  opacity:0.9;
  pointer-events:none;
}
.s1{top:12%;left:22%;}
.s2{top:20%;right:24%;}
.s3{top:42%;left:26%;}
.s4{top:42%;right:26%;}
.s5{top:72%;left:32%;}
.s6{top:72%;right:32%;}
@media (max-width:768px){
  .main-title{font-size:36px;letter-spacing:6px;}
  .count-item{width:85px;height:100px;}
  .count-num{font-size:34px;}
  .deco-left{width:200px;height:200px;}
  .deco-right{width:220px;height:200px;}
  .frame{padding:30px 16px;}
}
</style>
</head>
<body>
<div class="frame">
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="top-double-happiness">囍</div>
  <div class="top-sub">良 辰 将 至</div>
  <div class="main-title" id="mainTitle">婚礼倒计时</div>
  <div class="sub-title">一 生 一 世 · 一 心 一 意</div>

  <div class="count-wrap">
    <div class="count-item">
      <div class="count-num" id="day">00</div>
      <div class="count-unit">天</div>
    </div>
    <div class="count-item">
      <div class="count-num" id="hour">00</div>
      <div class="count-unit">时</div>
    </div>
    <div class="count-item">
      <div class="count-num" id="min">00</div>
      <div class="count-unit">分</div>
    </div>
    <div class="count-item">
      <div class="count-num" id="sec">00</div>
      <div class="count-unit">秒</div>
    </div>
  </div>

  <div class="mid-text" id="midText">所爱隔山海，山海皆可平</div>
  <div class="mid-date" id="midDate">良辰吉日 · 2027年1月1日 12:00</div>

  <div class="footer-text">WITH LOVE · FOREVER</div>
  <div class="footer-xi">囍</div>

  <div class="deco-left"></div>
  <div class="deco-right"></div>

  <div class="star s1"></div>
  <div class="star s2"></div>
  <div class="star s3"></div>
  <div class="star s4"></div>
  <div class="star s5"></div>
  <div class="star s6"></div>
</div>

<script>
const weddingTime = new Date("2027-01-01 12:00:00").getTime();
const marryTime = new Date("2026-12-24 11:30:00").getTime();

function update(){
  const now = Date.now();
  const diffWedding = weddingTime - now;
  let day, hour, min, sec;

  if(diffWedding > 0){
    document.getElementById("mainTitle").innerText = "婚礼倒计时";
    document.getElementById("midText").innerText = "所爱隔山海，山海皆可平";
    document.getElementById("midDate").innerText = "良辰吉日 · 2027年1月1日 12:00";

    day = Math.floor(diffWedding / (1000 * 60 * 60 * 24));
    hour = Math.floor((diffWedding % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    min = Math.floor((diffWedding % (1000 * 60 * 60)) / (1000 * 60));
    sec = Math.floor((diffWedding % (1000 * 60)) / 1000);
  }else{
    document.getElementById("mainTitle").innerText = "其实";
    document.getElementById("midText").innerText = "领证已经";
    document.getElementById("midDate").innerText = "";

    const diffMarry = now - marryTime;
    day = Math.floor(diffMarry / (1000 * 60 * 60 * 24));
    hour = Math.floor((diffMarry % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    min = Math.floor((diffMarry % (1000 * 60 * 60)) / (1000 * 60));
    sec = Math.floor((diffMarry % (1000 * 60)) / 1000);
  }
  document.getElementById("day").innerText = String(day).padStart(2,"0");
  document.getElementById("hour").innerText = String(hour).padStart(2,"0");
  document.getElementById("min").innerText = String(min).padStart(2,"0");
  document.getElementById("sec").innerText = String(sec).padStart(2,"0");
}
update();
setInterval(update, 1000);
</script>
</body>
</html>
